services:
  apk:
    build:
      context: .
      target: web
    image: rsaldos-apk:1.0.0
    container_name: rsaldos-apk
    ports:
      - "8095:80"
    restart: unless-stopped

  emulador:
    image: budtmo/docker-android:emulator_14.0
    container_name: rsaldos-emulador
    profiles: ["emulador"]
    devices:
      - /dev/kvm
    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"
      WEB_VNC: "true"
    ports:
      - "6080:6080"
    restart: unless-stopped

  instalador:
    build:
      context: .
      target: instalador
    image: rsaldos-instalador:1.0.0
    container_name: rsaldos-instalador
    profiles: ["emulador"]
    depends_on:
      - emulador
    restart: "no"
