server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    types {
        text/html html;
        application/vnd.android.package-archive apk;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    location = /rsaldos.apk {
        add_header Content-Disposition 'attachment; filename="R-Saldos-1.0.0-debug.apk"';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
